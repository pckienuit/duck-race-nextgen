<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦆 DUCK RACE NEXT-GEN | Đua Vịt Siêu Kịch Tính</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --card-border: #1f2d4a;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.4);
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      display: flex;
    }

    /* SIDEBAR / DASHBOARD */
    #sidebar {
      width: 380px;
      min-width: 380px;
      height: 100%;
      background: var(--card);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
      z-index: 20;
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), margin-left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
    }

    #sidebar.collapsed {
      margin-left: -380px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand-icon {
      font-size: 2rem;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-badge {
      font-size: 0.65rem;
      text-transform: uppercase;
      padding: 2px 6px;
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 6px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    textarea {
      width: 100%;
      height: 140px;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-sm {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-sm:hover {
      background: #334155;
      color: #fff;
    }

    .slider-group {
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .option-card {
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .option-card input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: auto;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      transition: transform 0.15s, filter 0.15s;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .btn-secondary:hover {
      background: #334155;
    }

    /* MAIN STAGE */
    #stage-container {
      flex: 1;
      height: 100%;
      position: relative;
      background: #0284c7;
      overflow: hidden;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* TOP BAR OVERLAY */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .top-bar-left, .top-bar-right {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .glass-btn {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.2s;
    }

    .glass-btn:hover {
      background: rgba(30, 41, 59, 0.85);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .timer-pill {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      padding: 8px 18px;
      border-radius: 9999px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    /* LEADERBOARD HUD */
    .leaderboard-hud {
      position: absolute;
      top: 75px;
      right: 20px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 10px 14px;
      width: 220px;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      transition: opacity 0.3s;
    }

    .hud-title {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .hud-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: #fff;
    }

    .hud-rank {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 900;
    }

    .rank-1 { background: #fbbf24; color: #78350f; }
    .rank-2 { background: #cbd5e1; color: #334155; }
    .rank-3 { background: #f97316; color: #7c2d12; }
    .rank-default { background: #334155; color: #94a3b8; }

    /* SLOW MO BANNER */
    #slowmo-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(239, 68, 68, 0.9);
      border: 2px solid #fff;
      color: #fff;
      font-size: 2rem;
      font-weight: 900;
      padding: 10px 30px;
      border-radius: 16px;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      box-shadow: 0 0 50px rgba(239, 68, 68, 0.8);
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 15;
    }

    #slowmo-banner.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* WINNER MODAL / PODIUM */
    #winner-modal {
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #winner-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .podium-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2px solid #f59e0b;
      border-radius: 24px;
      padding: 36px 40px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(245, 158, 11, 0.3), 0 0 100px rgba(0,0,0,0.8);
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #winner-modal.active .podium-card {
      transform: scale(1);
    }

    .trophy-badge {
      font-size: 4rem;
      margin-bottom: 12px;
      display: inline-block;
      animation: float 2s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .winner-subtitle {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fbbf24;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .winner-name {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 4px 20px rgba(255, 255, 255, 0.3);
      margin-bottom: 24px;
      word-break: break-word;
    }

    .podium-ranks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: rgba(0, 0, 0, 0.3);
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 24px;
    }

    .podium-subitem {
      text-align: left;
      font-size: 0.85rem;
    }

    .podium-subitem span {
      color: var(--text-muted);
      font-size: 0.75rem;
      display: block;
    }

    .podium-subitem strong {
      color: #fff;
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-eliminate {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: none;
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
      transition: all 0.15s;
    }

    .btn-eliminate:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>

  <!-- SIDEBAR CONTROL -->
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-icon">🦆</div>
      <div>
        <div style="display:flex; align-items:center; gap:8px;">
          <h1 class="brand-title">DUCK RACE</h1>
          <span class="brand-badge">NEXT-GEN</span>
        </div>
        <p style="font-size: 0.75rem; color: var(--text-muted);">Random Name Picker & Physics Race</p>
      </div>
    </div>

    <div>
      <div class="section-title">
        <span>Thí sinh tham gia (<span id="duck-count">0</span>)</span>
        <button class="btn-sm" id="btn-shuffle" title="Xáo trộn danh sách">🔀 Xáo tên</button>
      </div>
      <textarea id="names-input" placeholder="Nhập tên thí sinh, mỗi dòng 1 người..."></textarea>
    </div>

    <div class="btn-row">
      <button class="btn-sm" id="preset-class">🎓 Lớp học (8)</button>
      <button class="btn-sm" id="preset-giveaway">🎁 Giveaway (5)</button>
      <button class="btn-sm" id="preset-grand">🏆 Giải lớn (16)</button>
      <button class="btn-sm" id="btn-clear" style="color: #ef4444;">🗑️ Xóa hết</button>
    </div>

    <div class="slider-group">
      <div class="slider-header">
        <span>⏱️ Thời gian cuộc đua</span>
        <span id="duration-val" style="color: var(--accent); font-weight: 800;">10 giây</span>
      </div>
      <input type="range" id="race-duration" min="5" max="30" step="1" value="10">
    </div>

    <div class="options-grid">
      <label class="option-card">
        <input type="checkbox" id="opt-drama" checked>
        <span>🔥 Lội ngược dòng</span>
      </label>
      <label class="option-card">
        <input type="checkbox" id="opt-slowmo" checked>
        <span>🎬 Vạch đích Slow-Mo</span>
      </label>
      <label class="option-card">
        <input type="checkbox" id="opt-sound" checked>
        <span>🔊 Âm thanh Synth</span>
      </label>
      <label class="option-card">
        <input type="checkbox" id="opt-tts" checked>
        <span>🗣️ Đọc tên quán quân</span>
      </label>
    </div>

    <div class="actions">
      <button class="btn-primary" id="btn-start">
        <span>🚀 BẮT ĐẦU CUỘC ĐUA</span>
      </button>
      <div style="display:flex; gap:8px;">
        <button class="btn-secondary" id="btn-pause" style="flex:1;">⏸️ Tạm dừng</button>
        <button class="btn-secondary" id="btn-reset" style="flex:1;">🔄 Đua lại</button>
      </div>
    </div>
  </aside>

  <!-- MAIN STAGE -->
  <main id="stage-container">
    <canvas id="gameCanvas"></canvas>

    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="top-bar-left">
        <button class="glass-btn" id="btn-toggle-sidebar">
          <span id="sidebar-icon">◀</span> <span>Cài đặt</span>
        </button>
        <button class="glass-btn" id="btn-streamer-mode">
          <span>📺 Full Màn Hình</span>
        </button>
      </div>
      <div class="timer-pill" id="hud-timer">00:00.0</div>
      <div class="top-bar-right">
        <div class="glass-btn" id="hud-status" style="border-color: rgba(16, 185, 129, 0.4); color: #34d399;">
          <span>● Sẵn sàng</span>
        </div>
      </div>
    </div>

    <!-- LIVE LEADERBOARD HUD -->
    <div class="leaderboard-hud" id="hud-leaderboard">
      <div class="hud-title">
        <span>TOP DẪN ĐẦU</span>
        <span id="hud-duck-total">0 vịt</span>
      </div>
      <div id="hud-leader-list"></div>
    </div>

    <!-- SLOW MO BANNER -->
    <div id="slowmo-banner">🎬 PHOTO FINISH!</div>

    <!-- WINNER MODAL -->
    <div id="winner-modal">
      <div class="podium-card">
        <div class="trophy-badge">🏆</div>
        <div class="winner-subtitle">QUÁN QUÂN CUỘC ĐUA</div>
        <div class="winner-name" id="modal-winner-name">PHAN CHÍ KIÊN</div>
        <div class="podium-ranks">
          <div class="podium-subitem">
            <span>🥈 HẠNG NHÌ</span>
            <strong id="modal-rank-2">Hồ Nhật Khanh</strong>
          </div>
          <div class="podium-subitem">
            <span>🥉 HẠNG BA</span>
            <strong id="modal-rank-3">Đỗ Hoàng Linh</strong>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-eliminate" id="btn-eliminate-winner">
            ✂️ Loại quán quân & Đua vòng tiếp
          </button>
          <button class="btn-secondary" id="btn-close-modal">
            🔄 Đua lại với danh sách cũ
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // ==========================================
    // AUDIO SYNTHESIZER (ZERO EXTERNAL ASSETS)
    // ==========================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx && this.enabled) {
          try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (typeof AudioContextClass === 'function') {
              this.ctx = new AudioContextClass();
            } else {
              this.enabled = false;
            }
          } catch (e) {
            console.warn('AudioContext not supported:', e);
            this.enabled = false;
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playHorn() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(440, t);
          osc.frequency.exponentialRampToValueAtTime(880, t + 0.15);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.5);
        } catch(e) {}
      }

      playQuack(pitchMultiplier = 1) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300 * pitchMultiplier, t);
          osc.frequency.linearRampToValueAtTime(450 * pitchMultiplier, t + 0.08);
          osc.frequency.linearRampToValueAtTime(250 * pitchMultiplier, t + 0.2);
          gain.gain.setValueAtTime(0.15, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.25);
        } catch(e) {}
      }

      playNitro() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(150, t);
          osc.frequency.exponentialRampToValueAtTime(600, t + 0.4);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.4);
        } catch(e) {}
      }

      playSplash() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const bufferSize = this.ctx.sampleRate * 0.15;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800, t);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.25, t);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(t);
        } catch(e) {}
      }

      playCheer() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const t = this.ctx.currentTime + idx * 0.12;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.6);
          });
        } catch(e) {}
      }
    }

    const sound = new SoundEngine();

    // ==========================================
    // DUCK PALETTE & ACCESSORIES
    // ==========================================
    const DUCK_SKINS = [
      { body: '#fbbf24', shadow: '#d97706', beak: '#ea580c', name: 'Classic Gold' },
      { body: '#f43f5e', shadow: '#be123c', beak: '#fbbf24', name: 'Neon Rose' },
      { body: '#06b6d4', shadow: '#0e7490', beak: '#f97316', name: 'Cyan Wave' },
      { body: '#a855f7', shadow: '#7e22ce', beak: '#fbbf24', name: 'Cyber Violet' },
      { body: '#22c55e', shadow: '#15803d', beak: '#f97316', name: 'Lime Hunter' },
      { body: '#f97316', shadow: '#c2410c', beak: '#fde047', name: 'Sunset Blaze' },
      { body: '#f8fafc', shadow: '#94a3b8', beak: '#f97316', name: 'White Swan' },
      { body: '#334155', shadow: '#0f172a', beak: '#f59e0b', name: 'Ninja Shadow' }
    ];

    const ACCESSORIES = ['none', 'sunglasses', 'crown', 'grad_cap', 'headphone', 'cap'];

    // ==========================================
    // PARTICLE ENGINE (RIPPLES, SPLASHES, CONFETTI)
    // ==========================================
    class Particle {
      constructor(x, y, type, color) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.color = color;
        this.life = 1.0;
        this.decay = Math.random() * 0.03 + 0.02;

        if (type === 'wake') {
          this.vx = -Math.random() * 1.5 - 0.5;
          this.vy = (Math.random() - 0.5) * 0.8;
          this.radius = Math.random() * 3 + 2;
          this.maxRadius = this.radius * 3.5;
        } else if (type === 'nitro') {
          this.vx = -Math.random() * 4 - 2;
          this.vy = (Math.random() - 0.5) * 1.5;
          this.radius = Math.random() * 5 + 3;
        } else if (type === 'confetti') {
          this.vx = (Math.random() - 0.5) * 8;
          this.vy = Math.random() * -10 - 4;
          this.gravity = 0.25;
          this.size = Math.random() * 8 + 4;
          this.rotation = Math.random() * Math.PI * 2;
          this.vRot = (Math.random() - 0.5) * 0.2;
          this.decay = Math.random() * 0.008 + 0.005;
        }
      }

      update() {
        this.life -= this.decay;
        this.x += this.vx;
        this.y += this.vy;

        if (this.type === 'wake') {
          this.radius += 0.3;
        } else if (this.type === 'confetti') {
          this.vy += this.gravity;
          this.rotation += this.vRot;
        }
      }

      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);

        if (this.type === 'wake') {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(this.x, this.y, this.radius * 1.5, this.radius * 0.6, 0, 0, Math.PI * 2);
          ctx.stroke();
        } else if (this.type === 'nitro') {
          ctx.fillStyle = this.color || '#f59e0b';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius * this.life, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.type === 'confetti') {
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.fillStyle = this.color;
          ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
        }

        ctx.restore();
      }
    }

    // ==========================================
    // DUCK CLASS
    // ==========================================
    class Duck {
      constructor(id, name, laneY, skin, accessory) {
        this.id = id;
        this.name = name;
        this.laneY = laneY;
        this.currentY = laneY;
        this.progress = 0; // 0.0 to 1.0
        this.skin = skin;
        this.accessory = accessory;

        // Physics variables
        this.baseSpeed = 1.0;
        this.currentSpeed = this.baseSpeed;
        this.accel = 0;
        this.wobble = Math.random() * Math.PI * 2;
        this.nitroTimer = 0;
        this.spinTimer = 0;
        this.finished = false;
        this.finishTime = null;
        this.rank = null;
      }

      update(dt, raceTime, totalDuration, allowDrama) {
        if (this.finished) return;

        this.wobble += dt * 6;
        this.currentY = this.laneY + Math.sin(this.wobble) * 4;

        // Random dynamic behavior during race
        if (allowDrama) {
          // Comeback booster for trailing ducks
          if (raceTime > totalDuration * 0.4 && this.progress < 0.5 && Math.random() < 0.02 && this.nitroTimer <= 0) {
            this.nitroTimer = 1.2;
            sound.playNitro();
          }

          // Random short burst
          if (Math.random() < 0.01 && this.nitroTimer <= 0) {
            this.nitroTimer = 0.8;
          }

          // Small eddy/whirlpool stagger
          if (Math.random() < 0.003 && this.spinTimer <= 0 && this.nitroTimer <= 0) {
            this.spinTimer = 0.6;
            sound.playSplash();
          }
        }

        // Speed calculation
        let speed = this.baseSpeed + (Math.random() - 0.48) * 0.38;

        if (this.nitroTimer > 0) {
          this.nitroTimer -= dt;
          speed *= 1.65;
        }

        if (this.spinTimer > 0) {
          this.spinTimer -= dt;
          speed *= 0.25;
        }

        this.progress += (speed / totalDuration) * dt;

        if (this.progress >= 1.0) {
          this.progress = 1.0;
          this.finished = true;
        }
      }

      draw(ctx, startX, trackWidth) {
        const duckX = startX + this.progress * trackWidth;
        const duckY = this.currentY;

        ctx.save();
        ctx.translate(duckX, duckY);

        if (this.spinTimer > 0) {
          ctx.rotate(this.spinTimer * Math.PI * 6);
        }

        // 1. Duck Shadow
        ctx.fillStyle = 'rgba(0, 40, 80, 0.35)';
        ctx.beginPath();
        ctx.ellipse(0, 14, 22, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // 2. Duck Body
        ctx.fillStyle = this.skin.body;
        ctx.beginPath();
        ctx.ellipse(-2, 2, 18, 12, -0.05, 0, Math.PI * 2);
        ctx.fill();

        // 3. Duck Wing
        const wingFlap = Math.sin(this.wobble * 1.5) * 2;
        ctx.fillStyle = this.skin.shadow;
        ctx.beginPath();
        ctx.ellipse(-4, 0 + wingFlap, 10, 7, 0.2, 0, Math.PI * 2);
        ctx.fill();

        // 4. Duck Head & Cheek
        ctx.fillStyle = this.skin.body;
        ctx.beginPath();
        ctx.arc(12, -8, 10, 0, Math.PI * 2);
        ctx.fill();

        // 5. Beak
        ctx.fillStyle = this.skin.beak;
        ctx.beginPath();
        ctx.moveTo(18, -8);
        ctx.lineTo(27, -6);
        ctx.lineTo(19, -3);
        ctx.closePath();
        ctx.fill();

        // 6. Eye (Blinks occasionally)
        const isBlinking = Math.sin(this.wobble * 0.7) > 0.96;
        if (!isBlinking) {
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(15, -10, 2.2, 0, Math.PI * 2);
          ctx.fill();
          // Eye highlight
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(16, -11, 0.8, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(13, -10);
          ctx.lineTo(17, -10);
          ctx.stroke();
        }

        // 7. Accessory
        this.drawAccessory(ctx);

        // 8. Name Badge on Top
        this.drawNameTag(ctx);

        ctx.restore();
      }

      drawAccessory(ctx) {
        if (this.accessory === 'sunglasses') {
          ctx.fillStyle = '#111827';
          ctx.fillRect(11, -12, 9, 4);
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 1;
          ctx.strokeRect(11, -12, 9, 4);
        } else if (this.accessory === 'crown') {
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.moveTo(6, -16);
          ctx.lineTo(8, -23);
          ctx.lineTo(12, -18);
          ctx.lineTo(16, -23);
          ctx.lineTo(18, -16);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#ca8a04';
          ctx.lineWidth = 1;
          ctx.stroke();
        } else if (this.accessory === 'grad_cap') {
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(4, -18, 16, 4);
          ctx.beginPath();
          ctx.moveTo(12, -22);
          ctx.lineTo(24, -18);
          ctx.lineTo(12, -14);
          ctx.lineTo(0, -18);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#eab308';
          ctx.fillRect(2, -16, 2, 6);
        } else if (this.accessory === 'cap') {
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(12, -14, 8, Math.PI, 0);
          ctx.fill();
          ctx.fillRect(14, -14, 10, 2.5);
        }
      }

      drawNameTag(ctx) {
        const isNitro = this.nitroTimer > 0;
        ctx.save();
        ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        const textWidth = ctx.measureText(this.name).width;
        const tagW = Math.max(textWidth + 16, 42);
        const tagH = 18;
        const tagX = -tagW / 2 + 5;
        const tagY = -34;

        // Shadow / Glow
        if (isNitro) {
          ctx.shadowColor = '#f59e0b';
          ctx.shadowBlur = 12;
          ctx.fillStyle = '#f59e0b';
        } else {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        }

        // Rounded pill badge
        ctx.beginPath();
        if (typeof ctx.roundRect === 'function') {
          ctx.roundRect(tagX, tagY, tagW, tagH, 6);
        } else {
          ctx.rect(tagX, tagY, tagW, tagH);
        }
        ctx.fill();

        // Border
        ctx.strokeStyle = isNitro ? '#fef08a' : 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Text
        ctx.fillStyle = isNitro ? '#78350f' : '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.name, tagX + tagW / 2, tagY + tagH / 2);

        ctx.restore();
      }
    }

    // ==========================================
    // MAIN GAME CONTROLLER
    // ==========================================
    class DuckRaceGame {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.ducks = [];
        this.particles = [];
        this.finishedDucks = [];

        this.state = 'idle'; // 'idle', 'racing', 'paused', 'finished'
        this.raceTime = 0;
        this.totalDuration = 10;
        this.timeScale = 1.0;
        this.targetTimeScale = 1.0;
        this.slowMoTriggered = false;
        this.firstDuckFinished = false;
        this.finishGraceTimer = 0;

        this.waterOffset = 0;
        this.lastFrameTime = performance.now();

        // Track bounding geometry
        this.trackPaddingX = 80;
        this.trackPaddingTop = 80;
        this.trackPaddingBottom = 60;

        this.initDOM();
        this.resize();
        window.addEventListener('resize', () => this.resize());

        // Default roster
        this.setNames([
          'Phan Chí Kiên',
          'Hồ Nhật Khanh',
          'Đỗ Hoàng Linh',
          'Vũ Minh Tuấn',
          'Lê Phương My',
          'Nguyễn Đức Huy',
          'Trần Mai Trang',
          'Phạm Quốc Bảo'
        ]);

        requestAnimationFrame((t) => this.loop(t));
      }

      initDOM() {
        this.namesInput = document.getElementById('names-input');
        this.duckCountEl = document.getElementById('duck-count');
        this.durationInput = document.getElementById('race-duration');
        this.durationVal = document.getElementById('duration-val');
        this.optDrama = document.getElementById('opt-drama');
        this.optSlowmo = document.getElementById('opt-slowmo');
        this.optSound = document.getElementById('opt-sound');
        this.optTTS = document.getElementById('opt-tts');

        this.btnStart = document.getElementById('btn-start');
        this.btnPause = document.getElementById('btn-pause');
        this.btnReset = document.getElementById('btn-reset');
        this.btnShuffle = document.getElementById('btn-shuffle');
        this.btnClear = document.getElementById('btn-clear');

        this.sidebar = document.getElementById('sidebar');
        this.btnToggleSidebar = document.getElementById('btn-toggle-sidebar');
        this.sidebarIcon = document.getElementById('sidebar-icon');
        this.btnStreamerMode = document.getElementById('btn-streamer-mode');

        this.hudTimer = document.getElementById('hud-timer');
        this.hudStatus = document.getElementById('hud-status');
        this.hudLeaderList = document.getElementById('hud-leader-list');
        this.hudDuckTotal = document.getElementById('hud-duck-total');
        this.slowMoBanner = document.getElementById('slowmo-banner');

        this.winnerModal = document.getElementById('winner-modal');
        this.modalWinnerName = document.getElementById('modal-winner-name');
        this.modalRank2 = document.getElementById('modal-rank-2');
        this.modalRank3 = document.getElementById('modal-rank-3');
        this.btnEliminate = document.getElementById('btn-eliminate-winner');
        this.btnCloseModal = document.getElementById('btn-close-modal');

        // Presets
        document.getElementById('preset-class').onclick = () => {
          this.setNames(['Phan Chí Kiên', 'Hồ Nhật Khanh', 'Đỗ Hoàng Linh', 'Vũ Minh Tuấn', 'Lê Phương My', 'Nguyễn Đức Huy', 'Trần Mai Trang', 'Phạm Quốc Bảo']);
        };
        document.getElementById('preset-giveaway').onclick = () => {
          this.setNames(['Trúng iPhone 16 Pro', 'Voucher 500k Shopee', 'Vé Xem Phim IMAX', 'Bàn Phím Cơ NuPhy', 'Chúc Bạn May Mắn Lần Sau']);
        };
        document.getElementById('preset-grand').onclick = () => {
          this.setNames(['An', 'Bình', 'Cường', 'Dũng', 'Giang', 'Hải', 'Huy', 'Khoa', 'Linh', 'Long', 'Minh', 'Nam', 'Phong', 'Quân', 'Sơn', 'Tú']);
        };

        // Inputs
        this.namesInput.addEventListener('input', () => this.buildDucksFromInput());
        this.durationInput.addEventListener('input', (e) => {
          this.totalDuration = parseInt(e.target.value, 10);
          this.durationVal.innerText = `${this.totalDuration} giây`;
        });

        this.optSound.addEventListener('change', (e) => {
          sound.enabled = e.target.checked;
        });

        // Controls
        this.btnStart.onclick = () => this.startRace();
        this.btnPause.onclick = () => this.togglePause();
        this.btnReset.onclick = () => this.resetRace();
        this.btnShuffle.onclick = () => this.shuffleNames();
        this.btnClear.onclick = () => {
          this.namesInput.value = '';
          this.buildDucksFromInput();
        };

        // Sidebar toggle & Streamer Mode
        this.btnToggleSidebar.onclick = () => {
          this.sidebar.classList.toggle('collapsed');
          const isCollapsed = this.sidebar.classList.contains('collapsed');
          this.sidebarIcon.innerText = isCollapsed ? '▶' : '◀';
          setTimeout(() => this.resize(), 320);
        };

        this.btnStreamerMode.onclick = () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
            this.sidebar.classList.add('collapsed');
            this.sidebarIcon.innerText = '▶';
          } else {
            document.exitFullscreen().catch(() => {});
          }
          setTimeout(() => this.resize(), 320);
        };

        // Modal Actions
        this.btnCloseModal.onclick = () => {
          this.winnerModal.classList.remove('active');
          this.resetRace();
        };

        this.btnEliminate.onclick = () => {
          if (this.finishedDucks.length > 0) {
            const winner = this.finishedDucks[0].name;
            const lines = this.namesInput.value.split('\n').map(l => l.trim()).filter(l => l.length > 0 && l !== winner);
            this.namesInput.value = lines.join('\n');
            this.buildDucksFromInput();
            this.winnerModal.classList.remove('active');
            this.resetRace();
          }
        };

        // Hotkeys
        window.addEventListener('keydown', (e) => {
          if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
          if (e.code === 'Space') {
            e.preventDefault();
            if (this.state === 'idle') this.startRace();
            else this.togglePause();
          } else if (e.code === 'KeyR') {
            this.resetRace();
          }
        });
      }

      resize() {
        const rect = this.canvas.parentElement.getBoundingClientRect();
        this.canvas.width = rect.width * window.devicePixelRatio;
        this.canvas.height = rect.height * window.devicePixelRatio;
        this.ctx.resetTransform();
        this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        this.width = rect.width;
        this.height = rect.height;
        this.recalculateLanes();
      }

      setNames(names) {
        this.namesInput.value = names.join('\n');
        this.buildDucksFromInput();
      }

      shuffleNames() {
        const lines = this.namesInput.value.split('\n').map(l => l.trim()).filter(Boolean);
        for (let i = lines.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [lines[i], lines[j]] = [lines[j], lines[i]];
        }
        this.namesInput.value = lines.join('\n');
        this.buildDucksFromInput();
        sound.playSplash();
      }

      buildDucksFromInput() {
        const lines = this.namesInput.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        this.duckCountEl.innerText = lines.length;
        this.hudDuckTotal.innerText = `${lines.length} vịt`;

        this.ducks = lines.map((name, idx) => {
          const skin = DUCK_SKINS[idx % DUCK_SKINS.length];
          const acc = ACCESSORIES[idx % ACCESSORIES.length];
          return new Duck(idx, name, 0, skin, acc);
        });

        this.recalculateLanes();
        this.resetRace();
      }

      recalculateLanes() {
        if (!this.ducks.length) return;
        const availableHeight = this.height - this.trackPaddingTop - this.trackPaddingBottom;
        const spacing = availableHeight / (this.ducks.length + 1);

        this.ducks.forEach((duck, idx) => {
          duck.laneY = this.trackPaddingTop + spacing * (idx + 1);
          duck.currentY = duck.laneY;
        });
      }

      startRace() {
        if (this.ducks.length < 2) {
          alert('Vui lòng nhập ít nhất 2 thí sinh để đua!');
          return;
        }

        sound.init();
        sound.playHorn();

        this.state = 'racing';
        this.raceTime = 0;
        this.timeScale = 1.0;
        this.targetTimeScale = 1.0;
        this.slowMoTriggered = false;
        this.firstDuckFinished = false;
        this.finishGraceTimer = 0;
        this.finishedDucks = [];

        this.hudStatus.innerHTML = '<span>⚡ Đang tranh tài...</span>';
        this.hudStatus.style.borderColor = 'rgba(245, 158, 11, 0.6)';
        this.hudStatus.style.color = '#fbbf24';
        this.btnStart.innerHTML = '<span>🔥 ĐANG ĐUA...</span>';
        this.btnStart.style.filter = 'brightness(0.9)';

        // Spawn starter splash particles
        const startX = this.trackPaddingX;
        this.ducks.forEach(d => {
          for (let i = 0; i < 6; i++) {
            this.particles.push(new Particle(startX, d.laneY, 'wake', '#fff'));
          }
        });
      }

      togglePause() {
        if (this.state === 'racing') {
          this.state = 'paused';
          this.btnPause.innerText = '▶️ Tiếp tục';
          this.hudStatus.innerHTML = '<span>⏸️ Tạm dừng</span>';
        } else if (this.state === 'paused') {
          this.state = 'racing';
          this.btnPause.innerText = '⏸️ Tạm dừng';
          this.hudStatus.innerHTML = '<span>⚡ Đang tranh tài...</span>';
        }
      }

      resetRace() {
        this.state = 'idle';
        this.raceTime = 0;
        this.timeScale = 1.0;
        this.targetTimeScale = 1.0;
        this.slowMoTriggered = false;
        this.firstDuckFinished = false;
        this.finishGraceTimer = 0;
        this.finishedDucks = [];
        this.particles = [];

        this.ducks.forEach(d => {
          d.progress = 0;
          d.finished = false;
          d.finishTime = null;
          d.rank = null;
          d.nitroTimer = 0;
          d.spinTimer = 0;
        });

        this.hudTimer.innerText = '00:00.0';
        this.hudStatus.innerHTML = '<span>● Sẵn sàng</span>';
        this.hudStatus.style.borderColor = 'rgba(16, 185, 129, 0.4)';
        this.hudStatus.style.color = '#34d399';
        this.btnStart.innerHTML = '<span>🚀 BẮT ĐẦU CUỘC ĐUA</span>';
        this.btnStart.style.filter = 'none';
        this.btnPause.innerText = '⏸️ Tạm dừng';
        this.slowMoBanner.classList.remove('active');
        this.winnerModal.classList.remove('active');
        this.updateLeaderboardHUD();
      }

      onFinish() {
        this.state = 'finished';
        this.hudStatus.innerHTML = '<span>🏆 Đã về đích!</span>';
        this.hudStatus.style.borderColor = '#fbbf24';
        this.slowMoBanner.classList.remove('active');

        sound.playCheer();

        const winner = this.finishedDucks[0];
        const second = this.finishedDucks[1] || { name: 'Chưa có' };
        const third = this.finishedDucks[2] || { name: 'Chưa có' };

        // Explosive confetti
        const finishX = this.width - this.trackPaddingX;
        for (let i = 0; i < 180; i++) {
          const cColors = ['#f59e0b', '#ec4899', '#3b82f6', '#10b981', '#facc15', '#a855f7'];
          const rndColor = cColors[Math.floor(Math.random() * cColors.length)];
          this.particles.push(new Particle(finishX, this.height * 0.5, 'confetti', rndColor));
        }

        // Show Podium Modal
        setTimeout(() => {
          this.modalWinnerName.innerText = winner.name;
          this.modalRank2.innerText = second.name;
          this.modalRank3.innerText = third.name;
          this.winnerModal.classList.add('active');

          // Text-to-speech
          if (this.optTTS.checked && 'speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(`Chúc mừng quán quân ${winner.name} đã giành chiến thắng!`);
            utterance.lang = 'vi-VN';
            utterance.rate = 1.05;
            window.speechSynthesis.speak(utterance);
          }
        }, 900);
      }

      loop(timestamp) {
        const rawDt = Math.min((timestamp - this.lastFrameTime) / 1000, 0.1);
        this.lastFrameTime = timestamp;

        // Smooth timeScale interpolation for SlowMo
        this.timeScale += (this.targetTimeScale - this.timeScale) * 0.1;
        const dt = rawDt * this.timeScale;

        this.update(dt);
        this.draw();

        requestAnimationFrame((t) => this.loop(t));
      }

      update(dt) {
        this.waterOffset += dt * 40;

        if (this.state === 'racing') {
          this.raceTime += dt;
          const secs = Math.floor(this.raceTime);
          const tenths = Math.floor((this.raceTime % 1) * 10);
          this.hudTimer.innerText = `00:${secs < 10 ? '0' : ''}${secs}.${tenths}`;

          const trackWidth = this.width - this.trackPaddingX * 2;
          let leaderProgress = 0;

          // Update Ducks
          this.ducks.forEach(duck => {
            const prevFinished = duck.finished;
            duck.update(dt, this.raceTime, this.totalDuration, this.optDrama.checked);

            if (duck.progress > leaderProgress) {
              leaderProgress = duck.progress;
            }

            // Duck just finished
            if (!prevFinished && duck.finished) {
              duck.finishTime = this.raceTime;
              duck.rank = this.finishedDucks.length + 1;
              this.finishedDucks.push(duck);
              sound.playQuack(1.3);

              if (this.finishedDucks.length === 1) {
                // First place crossed! Trigger countdown to show podium
                this.firstDuckFinished = true;
                this.finishGraceTimer = 1.8; // Allow 1.8s for 2nd and 3rd place to cross!
                this.hudStatus.innerHTML = `<span>🥇 ${duck.name} CÁN ĐÍCH!</span>`;
                this.hudStatus.style.borderColor = '#fbbf24';
                sound.playCheer();
              }
            }

            // Spawn wake particles
            if (!duck.finished && Math.random() < 0.4) {
              const duckX = this.trackPaddingX + duck.progress * trackWidth;
              this.particles.push(new Particle(duckX - 16, duck.currentY + 6, 'wake', '#fff'));
            }

            // Spawn nitro particles
            if (duck.nitroTimer > 0) {
              const duckX = this.trackPaddingX + duck.progress * trackWidth;
              this.particles.push(new Particle(duckX - 18, duck.currentY, 'nitro', duck.skin.body));
            }
          });

          // Check for Slow-Mo near finish line
          if (this.optSlowmo.checked && !this.slowMoTriggered && leaderProgress >= 0.88 && this.finishedDucks.length === 0) {
            this.slowMoTriggered = true;
            this.targetTimeScale = 0.28; // Cinematic Slow-Mo!
            this.slowMoBanner.classList.add('active');
          }

          if (this.finishedDucks.length > 0) {
            this.targetTimeScale = 1.0;
            this.slowMoBanner.classList.remove('active');
          }

          // Handle grace period for Podium display
          if (this.firstDuckFinished && this.finishGraceTimer > 0) {
            this.finishGraceTimer -= dt;
            if (this.finishGraceTimer <= 0) {
              this.firstDuckFinished = false;
              this.onFinish();
            }
          }

          this.updateLeaderboardHUD();
        }

        // Update particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
          this.particles[i].update();
          if (this.particles[i].life <= 0) {
            this.particles.splice(i, 1);
          }
        }
      }

      updateLeaderboardHUD() {
        const sorted = [...this.ducks].sort((a, b) => {
          if (a.finished && b.finished) return a.finishTime - b.finishTime;
          if (a.finished) return -1;
          if (b.finished) return 1;
          return b.progress - a.progress;
        });

        const top3 = sorted.slice(0, 4);
        this.hudLeaderList.innerHTML = top3.map((duck, idx) => {
          const rankClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : 'rank-default';
          const pct = Math.floor(duck.progress * 100);
          return `
            <div class="hud-item">
              <span class="hud-rank ${rankClass}">${idx + 1}</span>
              <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${duck.name}</span>
              <span style="font-size:0.7rem; color:#94a3b8;">${duck.finished ? '🏆 ĐÍCH' : pct + '%'}</span>
            </div>
          `;
        }).join('');
      }

      draw() {
        this.ctx.clearRect(0, 0, this.width, this.height);

        // 1. Procedural Water Background
        this.drawWater();

        // 2. Track Lines, Buoys & Finish Line
        this.drawTrack();

        // 3. Particles (Under layer)
        this.particles.forEach(p => p.draw(this.ctx));

        // 4. Ducks (Sorted by Y for proper perspective overlap)
        const sortedDucks = [...this.ducks].sort((a, b) => a.currentY - b.currentY);
        const trackWidth = this.width - this.trackPaddingX * 2;
        sortedDucks.forEach(duck => duck.draw(this.ctx, this.trackPaddingX, trackWidth));
      }

      drawWater() {
        // Deep river gradient
        const grad = this.ctx.createLinearGradient(0, 0, 0, this.height);
        grad.addColorStop(0, '#0284c7');
        grad.addColorStop(0.5, '#0369a1');
        grad.addColorStop(1, '#075985');
        this.ctx.fillStyle = grad;
        this.ctx.fillRect(0, 0, this.width, this.height);

        // Flowing river sine lines
        this.ctx.save();
        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        this.ctx.lineWidth = 3;

        for (let y = 30; y < this.height; y += 45) {
          this.ctx.beginPath();
          for (let x = 0; x < this.width; x += 40) {
            const waveY = y + Math.sin((x + this.waterOffset) * 0.02) * 5;
            if (x === 0) this.ctx.moveTo(x, waveY);
            else this.ctx.lineTo(x, waveY);
          }
          this.ctx.stroke();
        }
        this.ctx.restore();
      }

      drawTrack() {
        const startX = this.trackPaddingX;
        const finishX = this.width - this.trackPaddingX;

        // Lane separator lines
        this.ctx.save();
        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        this.ctx.setLineDash([8, 12]);
        this.ctx.lineWidth = 1.5;

        this.ducks.forEach(duck => {
          this.ctx.beginPath();
          this.ctx.moveTo(startX, duck.laneY);
          this.ctx.lineTo(finishX, duck.laneY);
          this.ctx.stroke();
        });
        this.ctx.restore();

        // Start Banner & Line
        this.ctx.save();
        this.ctx.strokeStyle = '#38bdf8';
        this.ctx.lineWidth = 4;
        this.ctx.beginPath();
        this.ctx.moveTo(startX, this.trackPaddingTop - 20);
        this.ctx.lineTo(startX, this.height - this.trackPaddingBottom + 20);
        this.ctx.stroke();

        // Start Buoy
        this.drawBuoy(startX, this.trackPaddingTop - 25, '#38bdf8');
        this.drawBuoy(startX, this.height - this.trackPaddingBottom + 25, '#38bdf8');
        this.ctx.restore();

        // Finish Line (Checkerboard Pattern)
        this.ctx.save();
        const finishTop = this.trackPaddingTop - 20;
        const finishBottom = this.height - this.trackPaddingBottom + 20;
        const stripeH = 14;
        const checkerW = 12;

        for (let y = finishTop; y < finishBottom; y += stripeH) {
          const isOdd = Math.floor((y - finishTop) / stripeH) % 2 === 0;
          this.ctx.fillStyle = isOdd ? '#ef4444' : '#ffffff';
          this.ctx.fillRect(finishX - checkerW / 2, y, checkerW, stripeH);
        }

        // Finish Buoys
        this.drawBuoy(finishX, finishTop - 5, '#ef4444');
        this.drawBuoy(finishX, finishBottom + 5, '#ef4444');

        // Finish Sign
        this.ctx.font = '900 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        this.ctx.fillStyle = '#ffffff';
        this.ctx.textAlign = 'center';
        this.ctx.shadowColor = 'rgba(0,0,0,0.8)';
        this.ctx.shadowBlur = 6;
        this.ctx.fillText('🏁 FINISH', finishX, finishTop - 18);

        this.ctx.restore();
      }

      drawBuoy(x, y, color) {
        this.ctx.save();
        this.ctx.fillStyle = color;
        this.ctx.beginPath();
        this.ctx.arc(x, y, 7, 0, Math.PI * 2);
        this.ctx.fill();
        this.ctx.strokeStyle = '#fff';
        this.ctx.lineWidth = 2;
        this.ctx.stroke();
        this.ctx.restore();
      }
    }

    // Launch game on DOM load
    window.addEventListener('DOMContentLoaded', () => {
      window.game = new DuckRaceGame();
    });
  </script>
</body>
</html>
